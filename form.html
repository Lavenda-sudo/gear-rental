<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List Your Gear</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background-color: #f8fafc; }
    .form-container { background: white; max-width: 450px; margin: 0 auto; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, select { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .btn-submit { background-color: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .btn-submit:hover { background-color: #1d4ed8; }
    a { text-decoration: none; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>

  <div class="form-container">
    <a href="index.html">← Back to Home</a>
    <h2>List Gear for Rent</h2>

    <form id="rentalForm">
      <label>Item Name:</label>
      <input type="text" id="name" value="Canon EOS R5" required>

      <label>Category:</label>
      <select id="category">
        <option value="CAMERAS">Cameras</option>
        <option value="DRONES">Drones</option>
        <option value="TOOLS">Power Tools</option>
        <option value="AUDIO">Audio</option>
      </select>

      <label>Price per day ($):</label>
      <input type="number" id="price" value="60" required>

      <label>Location:</label>
      <input type="text" id="location" value="City Center" required>

      <label>Image URL:</label>
      <input type="text" id="imageUrl" value="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=500" required>

      <!-- Explicit type="button" with onclick handler -->
      <button type="button" class="btn-submit" onclick="saveGear()">Publish Rental Item</button>
    </form>
  </div>

  <script>
    function saveGear() {
      // 1. Collect inputs
      const newItem = {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        price: document.getElementById('price').value,
        location: document.getElementById('location').value,
        image: document.getElementById('imageUrl').value
      };

      console.log('Publishing item:', newItem);

      // 2. Read existing items
      let existingItems = [];
      try {
        existingItems = JSON.parse(localStorage.getItem('myGearList')) || [];
      } catch (err) {
        existingItems = [];
      }

      // 3. Add new item
      existingItems.push(newItem);

      // 4. Save to localStorage
      localStorage.setItem('myGearList', JSON.stringify(existingItems));

      alert('Item Published: ' + newItem.name);

      // 5. Redirect back to homepage
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
